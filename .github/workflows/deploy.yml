name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tres cosas que solo se ven ya publicadas y con el cliente delante: una
      # seccion que revienta, una clave sin traducir, y —dos veces ya— un
      # fichero cambiado sin subirle el `?v=`, que Pages sigue sirviendo viejo.
      - name: Comprobar antes de publicar
        run: |
          node tooling/check-app-render.mjs
          node tooling/check-app-i18n.mjs
          node tooling/check-versiones.mjs

      - name: Deploy (wrangler pages deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=comando-web --branch=main --commit-dirty=true
